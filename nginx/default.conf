# ─────────────────────────────────────────────────────────────
# Nginx — Configuracao de Producao
# PET-Saude Picos • VPS Hostinger
#
# Dominio raiz  : petsaudepicos.tech  → Portal Hub (este projeto)
# Subdominio    : clara.petsaudepicos.tech → Sistema Clara
# ─────────────────────────────────────────────────────────────

# Redireciona HTTP → HTTPS para todos os dominios
server {
    listen 80;
    server_name petsaudepicos.tech www.petsaudepicos.tech clara.petsaudepicos.tech;
    return 301 https://$host$request_uri;
}

# ── Portal Hub (dominio raiz) ──────────────────────────────
server {
    listen 443 ssl;
    server_name petsaudepicos.tech www.petsaudepicos.tech;

    # Certificados SSL (gerados pelo Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/petsaudepicos.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petsaudepicos.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ── Sistema Clara (subdominio) ─────────────────────────────
server {
    listen 443 ssl;
    server_name clara.petsaudepicos.tech;

    # Certificados SSL — o mesmo wildcard ou um certificado separado
    # Se usar certbot separado: certbot --nginx -d clara.petsaudepicos.tech
    ssl_certificate     /etc/letsencrypt/live/clara.petsaudepicos.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clara.petsaudepicos.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # WebSocket (necessario para o chat em tempo real da Clara)
    location / {
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     120s;
        proxy_connect_timeout  10s;
    }
}
